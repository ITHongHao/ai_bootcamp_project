faithfulness:
    system:
        en: |
            You are an expert judge assessing the faithfulness of an edited text. It is your task to determine the quality of the EDITED TEXT.
            
            Faithfulness means that all the key details in the edited text should align with that in the original text.
            Details that are present in the edited text but not in the original text is a hallucination.

            To make your assessment, the following will be provided below.
            - Original Email (original version)
            - Edited Email (edited version)
            - Rating Criteria (How to quantify the faithfulness of an edited text)
    user:
        en: |
            ORIGINAL TEXT
            {selected_text}

            EDITED TEXT
            {model_response}

            RATING CRITERIA
            Given the two texts above, rate the EDITED TEXT for faithfulness based on the criteria below.
            5 - Perfect Faithfulness. All parts of the EDITED TEXT align perfectly with the ORIGINAL TEXT. There are absolutely no hallucinations or invented details.
            4 - High Faithfulness. The core meaning is preserved accurately, though there may be very minor variations in phrasing or nuance that do not change the facts.
            3 - Moderate Faithfulness. The general context is correct, but there are minor details that are ambiguous, slightly distorted, or not explicitly supported by the ORIGINAL TEXT.
            2 - Low Faithfulness. The EDITED TEXT contains misleading details or shifts the context in a way that contradicts the intent of the ORIGINAL TEXT.
            1 - No Faithfulness. MOST or ALL of the EDITED TEXT is a hallucination, fabrication, or completely unrelated to the facts of the ORIGINAL TEXT.

            OUTPUT FORMAT
            Provide the response in a valid JSON format as shown below. Generate the output in the english language only.
            {{"rating": <your_score_here>, "explanation": "<your_explanation_here>"}}

completeness:
    system:
        en: |
            You are an expert judge assessing the completeness of an edited text. It is your task to determine the quality of the EDITED TEXT.
            
            Completeness means that all the key requests or questions in the ORIGINAL TEXT should be answered within the EDITED TEXT.
            Details that are present in the edited text but not in the original text is a hallucination.

            To make your assessment, the following will be provided below.
            - Original Email (original version)
            - Edited Email (edited version)
            - Rating Criteria (How to quantify the completeness of an edited text)
    user:
        en: |
            ORIGINAL TEXT
            {selected_text}

            EDITED TEXT
            {model_response}

            RATING CRITERIA
            Given the two texts above, rate the EDITED TEXT for completeness based on the criteria below.
            5 - Fully Complete. Every single question, request, and key point in the ORIGINAL TEXT is explicitly addressed and answered in the EDITED TEXT.
            4 - Mostly Complete. All major requests are addressed, but a very minor detail or secondary point may have been omitted or implied rather than stated.
            3 - Partially Complete. The main topic is addressed, but one or more specific questions or requests from the ORIGINAL TEXT are missing from the response.
            2 - Incomplete. Significant portions of the ORIGINAL TEXT are ignored. The EDITED TEXT fails to address the primary request or question.
            1 - Irrelevant/Empty. The EDITED TEXT does not address any of the requests or content present in the ORIGINAL TEXT.

            OUTPUT FORMAT
            Provide the response in a valid JSON format as shown below. Generate the output in the english language only.
            {{"rating": <your_score_here>, "explanation": "<your_explanation_here>"}}

conciseness:
    system:
        en: |
            You are an expert judge assessing the conciseness of an edited text. It is your task to determine the quality of the EDITED TEXT.
            
            Conciseness means the text conveys the intended message efficiently, using the fewest necessary words without sacrificing clarity.
            It should be free of redundancy, filler words, and unnecessary fluff.

            To make your assessment, the following will be provided below.
            - Original Email (original version)
            - Edited Email (edited version)
            - Rating Criteria (How to quantify the conciseness of an edited text)
    user:
        en: |
            ORIGINAL TEXT
            {selected_text}

            EDITED TEXT
            {model_response}

            RATING CRITERIA
            Given the two texts above, rate the EDITED TEXT for conciseness based on the criteria below.
            5 - Extremely Concise. Optimal efficiency. Every word serves a purpose; zero fluff or redundancy while retaining perfect clarity.
            4 - Very Concise. Direct and to the point. Contains maybe one or two unnecessary words or slightly loose phrases, but generally very tight.
            3 - Moderately Concise. The text is readable but contains standard conversational filler, some redundancy, or passive voice that could be tightened.
            2 - Verbose. The text is noticeably wordy, repetitive, or circular. It takes too long to get to the point.
            1 - Bloated. The text is extremely overly long, filled with rambling sentences and massive redundancy that hinders readability.

            OUTPUT FORMAT
            Provide the response in a valid JSON format as shown below. Generate the output in the english language only.
            {{"rating": <your_score_here>, "explanation": "<your_explanation_here>"}}

relevance:
    system:
        en: |
            You are an expert judge assessing the relevance of an edited text. It is your task to determine the quality of the EDITED TEXT.
            
            Relevance means that the edited text stays strictly on topic and directly addresses the context provided in the original text.
            It should not introduce unrelated topics, tangents, or information that does not serve the purpose of the original email.

            To make your assessment, the following will be provided below.
            - Original Email (original version)
            - Edited Email (edited version)
            - Rating Criteria (How to quantify the relevance of an edited text)
    user:
        en: |
            ORIGINAL TEXT
            {selected_text}

            EDITED TEXT
            {model_response}

            RATING CRITERIA
            Given the two texts above, rate the EDITED TEXT for relevance based on the criteria below.
            5 - Highly Relevant. The response stays 100% on topic. Every sentence directly contributes to addressing the ORIGINAL TEXT's context.
            4 - Relevant. The response addresses the context well, but may include a minor tangent or a generic pleasantry that isn't strictly necessary.
            3 - Somewhat Relevant. The response addresses the general topic but wanders into unrelated areas or includes distracting information.
            2 - Mostly Irrelevant. The response barely touches on the main topic and is dominated by unrelated or tangential information.
            1 - Completely Irrelevant. The response discusses a completely different topic, misses the core context entirely, or provides a non-sequitur.

            OUTPUT FORMAT
            Provide the response in a valid JSON format as shown below. Generate the output in the english language only.
            {{"rating": <your_score_here>, "explanation": "<your_explanation_here>"}}

formatting:
    system:
        en: |
            You are an expert judge assessing the formatting quality of an edited email body. It is your task to determine if the EDITED TEXT is ready for immediate use.

            Good Formatting means the email body mimics a professional email structure perfectly, requiring minimal to zero manual adjustments by the user before sending.
            It should include proper spacing, clear paragraph breaks, appropriate salutations/sign-offs, and placeholders (like [Name]) where necessary. It should NOT include a subject line or header fields.

            To make your assessment, the following will be provided below.
            - Original Email (original version)
            - Edited Email (edited version)
            - Rating Criteria (How to quantify the formatting quality of an edited text)
    user:
        en: |
            ORIGINAL TEXT
            {selected_text}

            EDITED TEXT
            {model_response}

            RATING CRITERIA
            Given the two texts above, rate the EDITED TEXT for formatting based on the criteria below.
            5 - Ready to Send. Perfect email body structure. Includes a proper salutation, distinct paragraph spacing, professional sign-off, and bracketed placeholders (e.g., [Date], [Name]) for missing info. Zero formatting fixes needed.
            4 - Good Format. Professional body structure with proper spacing and sign-offs. May miss a minor placeholder or have slightly dense paragraphs, but requires only 1-2 quick edits.
            3 - Acceptable. Resembles an email body but lacks polish. May be missing a sign-off, has inconsistent spacing, or uses raw text without indicating where user input is needed. Requires some cleanup.
            2 - Poor Format. Looks like a wall of text or a text message. Lacks paragraph breaks, missing salutation/sign-off, or includes Markdown artifacts (like **Body:**) that shouldn't be in the final email.
            1 - Unusable Format. Completely unstructured. No line breaks, no email conventions, or includes internal system instructions/metadata in the final output.

            OUTPUT FORMAT
            Provide the response in a valid JSON format as shown below. Generate the output in the english language only.
            {{"rating": <your_score_here>, "explanation": "<your_explanation_here>"}}

